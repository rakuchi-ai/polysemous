<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>GMARCH英語 4択小テスト</title>
<style>
:root{--bg:#F3F5F9;--sf:#fff;--ink:#172033;--mut:#5d6677;--line:#d3d9e6;--ac:#3B4CCA;--acT:#fff;--ok:#1E8E5A;--okBg:#E1F3EA;--ng:#C93C4B;--ngBg:#FBE6E9;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11141B;--sf:#1A1F2A;--ink:#E7EAF3;--mut:#9AA3B5;--line:#2B3342;--ac:#8E9BFF;--acT:#10131c;--ok:#4CC68A;--okBg:#12301F;--ng:#FF7A88;--ngBg:#3A1820;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11141B;--sf:#1A1F2A;--ink:#E7EAF3;--mut:#9AA3B5;--line:#2B3342;--ac:#8E9BFF;--acT:#10131c;--ok:#4CC68A;--okBg:#12301F;--ng:#FF7A88;--ngBg:#3A1820;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
[hidden]{display:none!important}
h1{font-size:22px;margin:8px 0 4px;letter-spacing:.02em}
h2{margin:0}
p{margin:0}
.lead{color:var(--mut);font-size:14px;margin-bottom:20px}
.sec{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.sec h3{font-size:14px;margin:0 0 10px;color:var(--mut);font-weight:600}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:60px}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--sf);border-radius:10px;padding:10px 12px;min-height:44px}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.seg button[aria-pressed="true"]{border-color:var(--ac);background:var(--ac);color:var(--acT);font-weight:600}
.primary{width:100%;background:var(--ac);color:var(--acT);border-color:var(--ac);font-weight:700;font-size:17px;min-height:52px}
.primary:disabled,.row button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;margin-top:10px}
.row button{flex:1}
.ghost{background:transparent;border-color:transparent;color:var(--mut);padding:8px}
.big{font-size:30px;font-weight:700;line-height:1.1}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .25s}
#prog{font-size:14px;color:var(--mut);min-width:56px;text-align:right}
.card{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:22px 18px;margin-bottom:14px}
.pos{display:inline-block;font-size:13px;color:var(--ac);border:1px solid var(--ac);border-radius:6px;padding:0 8px;margin-bottom:8px}
#word{font:700 40px/1.15 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;overflow-wrap:anywhere}
.ask{color:var(--mut);font-size:14px;margin-top:8px}
.opt{display:flex;gap:12px;width:100%;text-align:left;margin-bottom:10px;padding:12px 14px;align-items:flex-start;line-height:1.5}
.opt .n{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--mut);margin-top:1px}
.opt:disabled{opacity:1;cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okBg)}
.opt.ng{border-color:var(--ng);background:var(--ngBg)}
.opt.ok .n{background:var(--ok);border-color:var(--ok);color:var(--sf)}
.opt.ng .n{background:var(--ng);border-color:var(--ng);color:var(--sf)}
#fb{min-height:28px;font-weight:700;margin:2px 0 8px}
#fb.ok{color:var(--ok)}
#fb.ng{color:var(--ng)}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{padding:12px 0;border-top:1px solid var(--line)}
ul.list li:first-child{border-top:0}
ul.list .w{font:700 20px/1.2 "Iowan Old Style",Palatino,Georgia,serif;margin-right:8px}
ul.list .p{font-size:12px;color:var(--mut)}
ul.list .m{font-size:14px;color:var(--ink);margin-top:2px}
.empty{color:var(--mut);font-size:14px}
.danger{color:var(--ng);border-color:var(--ng)}
</style>
</head>
<body>
<main>
<section id="home">
  <h1>GMARCH英語 4択小テスト</h1>
  <p class="lead">多義語・派生語からランダムに出題します。間違えた問題は自動で保存され、あとでやり直せます。</p>
  <div class="sec">
    <h3>出題範囲</h3>
    <div class="seg" id="scope"></div>
  </div>
  <div class="sec">
    <h3>問題数</h3>
    <div class="seg" id="count"></div>
  </div>
  <button class="primary" id="go">テストを始める</button>
  <div class="sec" style="margin-top:14px">
    <h3>間違えた問題</h3>
    <p class="big" id="wn">0<span style="font-size:15px;font-weight:500;color:var(--mut)"> 問</span></p>
    <div class="row">
      <button id="rv">やり直す</button>      <button id="ls">一覧を見る</button>
    </div>
  </div>
</section>

<section id="quiz" hidden>
  <div class="top"><button class="ghost" id="quit">やめる</button><div class="bar"><i id="bar"></i></div><span id="prog"></span></div>
  <div class="card"><span class="pos" id="pos"></span><h2 id="word"></h2><p class="ask">この単語の意味として正しいものを選んでください</p></div>
  <div id="opts"></div>
  <p id="fb" role="status"></p>
  <button class="primary" id="next" hidden>次へ</button>
</section>

<section id="result" hidden>
  <div class="card">
    <p class="ask" id="rl">結果</p>
    <p class="big" id="score"></p>
  </div>
  <div class="sec" id="missWrap"><h3>今回の間違い</h3><ul class="list" id="miss"></ul></div>
  <button class="primary" id="again">もう一度</button>
  <div class="row"><button id="rv2">間違いをやり直す</button><button id="hm">ホームへ</button></div>
</section>

<section id="list" hidden>
  <div class="top"><button class="ghost" id="back">← 戻る</button></div>
  <div class="sec"><h3>間違えた問題</h3><ul class="list" id="wl"></ul></div>
  <div class="row"><button id="rv3">やり直す</button><button id="clr" class="danger">すべて削除</button></div>
</section>
</main>

<script>
const DATA = [
  {"id":"p1","set":"p","w":"press","pos":"名・動","m":"【名】新聞・報道陣、印刷機 【動】〜を強く押す、〜を強要する"},
  {"id":"p2","set":"p","w":"article","pos":"名","m":"【名】記事、品物・商品、条項・個条"},
  {"id":"p3","set":"p","w":"bill","pos":"名","m":"【名】請求書、紙幣、法案、鳥のくちばし"},
  {"id":"p4","set":"p","w":"board","pos":"名・動","m":"【名】板、委員会・理事会、（船・飛行機などの）機内 【動】〜に乗り込む"},
  {"id":"p5","set":"p","w":"charge","pos":"名・動","m":"【名】料金、責任・担当、告発・容疑 【動】〜を請求する、〜を非難・告発する、〜に充電する"},
  {"id":"p6","set":"p","w":"court","pos":"名","m":"【名】裁判所・法廷、コート（テニス等）、宮廷"},
  {"id":"p7","set":"p","w":"interest","pos":"名","m":"【名】興味・関心、利息・金利、利益・利害関係"},
  {"id":"p8","set":"p","w":"issue","pos":"名・動","m":"【名】問題・論点、（雑誌などの）発行号 【動】〜を発行する、〜を出す"},
  {"id":"p9","set":"p","w":"last","pos":"形・動","m":"【形】最後の、この前の 【動】（時間が）続く、持ちこたえる"},
  {"id":"p10","set":"p","w":"observe","pos":"動","m":"【動】〜を観察する、〜を守る（規則・法律等）、（意見を）述べる"},
  {"id":"p11","set":"p","w":"subject","pos":"名・形","m":"【名】主題、科目、被験者、臣民・国民 【形】〜の影響を受けやすい、〜に従属する"},
  {"id":"p12","set":"p","w":"plant","pos":"名・動","m":"【名】植物、工場、（大型の）機械・設備 【動】〜を植える"},
  {"id":"p13","set":"p","w":"flat","pos":"形・名","m":"【形】平らな、きっぱりした 【名】アパート（イギリス英語）"},
  {"id":"p14","set":"p","w":"store","pos":"名・動","m":"【名】店、蓄え 【動】〜を蓄える、〜を保存する"},
  {"id":"p15","set":"p","w":"match","pos":"名・動","m":"【名】試合、マッチ（火）、調和する人・物 【動】〜に一致する、〜と調和する"},
  {"id":"p16","set":"p","w":"ruler","pos":"名","m":"【名】定規、支配者"},
  {"id":"p17","set":"p","w":"address","pos":"名・動","m":"【名】住所、演説 【動】（問題などに）取り組む、〜に演説する、〜に話しかける"},
  {"id":"p18","set":"p","w":"capital","pos":"名・形","m":"【名】首都、資本、大文字 【形】主要な、死刑の"},
  {"id":"p19","set":"p","w":"custom","pos":"名","m":"【名】（社会的な）慣習、習慣 【名（複）】customs 税関、関税"},
  {"id":"p20","set":"p","w":"fine","pos":"形・名・動","m":"【形】素晴らしい、細かい・細密な 【名】罰金 【動】〜に罰金を科す"},
  {"id":"p184","set":"p","w":"token","pos":"名・形","m":"【名】しるし・形見、代用貨幣 【形】形ばかりの"},
  {"id":"d1","set":"d","w":"ruling","pos":"形・名","m":"【形】支配的な、与党の 【名】判決"},
  {"id":"d2","set":"d","w":"striking","pos":"形","m":"【形】著しい、目立つ"},
  {"id":"d3","set":"d","w":"telling","pos":"形","m":"【形】効果的な、核心を突いた、感情を表す"},
  {"id":"d4","set":"d","w":"promising","pos":"形","m":"【形】前途有望な"},
  {"id":"d5","set":"d","w":"prominent","pos":"形","m":"【形】傑出した、目立つ"}
];

(function(){
  const KEY_MISS = 'gmarch_quiz_miss_v2';
  let state = { scope: 'all', count: 10, questions: [], currentIndex: 0, score: 0, currentMisses: [], isRetryMode: false };

  const homeSec = document.getElementById('home'), quizSec = document.getElementById('quiz'), resultSec = document.getElementById('result'), listSec = document.getElementById('list');
  const scopeDiv = document.getElementById('scope'), countDiv = document.getElementById('count'), goBtn = document.getElementById('go'), wnEl = document.getElementById('wn'), rvBtn = document.getElementById('rv'), lsBtn = document.getElementById('ls');
  const quitBtn = document.getElementById('quit'), barEl = document.getElementById('bar'), progEl = document.getElementById('prog'), posEl = document.getElementById('pos'), wordEl = document.getElementById('word'), optsDiv = document.getElementById('opts'), fbEl = document.getElementById('fb'), nextBtn = document.getElementById('next');
  const rlEl = document.getElementById('rl'), scoreEl = document.getElementById('score'), missListEl = document.getElementById('miss'), againBtn = document.getElementById('again'), rv2Btn = document.getElementById('rv2'), hmBtn = document.getElementById('hm');
  const backBtn = document.getElementById('back'), wlEl = document.getElementById('wl'), rv3Btn = document.getElementById('rv3'), clrBtn = document.getElementById('clr');

  function getStoredMisses() { try { return JSON.parse(localStorage.getItem(KEY_MISS)) || []; } catch(e) { return []; } }
  function saveMisses(newMisses) {
    if (!newMisses || newMisses.length === 0) return;
    let stored = getStoredMisses(), map = new Map();
    stored.forEach(item => map.set(item.id, item));
    newMisses.forEach(item => map.set(item.id, item));
    localStorage.setItem(KEY_MISS, JSON.stringify(Array.from(map.values())));
    updateMissCount();
  }

  function updateMissCount() {
    const stored = getStoredMisses();
    wnEl.innerHTML = `${stored.length}<span style="font-size:15px;font-weight:500;color:var(--mut)"> 問</span>`;
    rvBtn.disabled = stored.length === 0;
    rv2Btn.disabled = stored.length === 0;
    rv3Btn.disabled = stored.length === 0;
  }

  function showSection(sec) {
    homeSec.hidden = true; quizSec.hidden = true; resultSec.hidden = true; listSec.hidden = true;
    sec.hidden = false; window.scrollTo(0, 0);
  }

  const scopes = [{id: 'all', label: 'すべて'}, {id: 'p', label: '多義語'}, {id: 'd', label: '派生語'}];
  const counts = [5, 10, 20, 30, 'all'];

  function initConfigUI() {
    if(!scopeDiv || !countDiv) return;
    scopeDiv.innerHTML = '';
    scopes.forEach(s => {
      const btn = document.createElement('button');
      btn.textContent = s.label;
      btn.setAttribute('aria-pressed', state.scope === s.id ? 'true' : 'false');
      btn.addEventListener('click', () => { state.scope = s.id; initConfigUI(); });
      scopeDiv.appendChild(btn);
    });
    countDiv.innerHTML = '';
    counts.forEach(c => {
      const btn = document.createElement('button');
      btn.textContent = c === 'all' ? 'すべて' : `${c}問`;
      btn.setAttribute('aria-pressed', state.count === c ? 'true' : 'false');
      btn.addEventListener('click', () => { state.count = c; initConfigUI(); });
      countDiv.appendChild(btn);
    });
  }

  function shuffle(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function startQuiz(retryList = null) {
    state.currentIndex = 0; state.score = 0; state.currentMisses = []; state.isRetryMode = !!retryList;
    let targetData = DATA;
    if (retryList) targetData = retryList;
    else if (state.scope !== 'all') targetData = DATA.filter(item => item.set === state.scope);

    if (targetData.length === 0) { alert('出題できる問題がありません。'); return; }

    let shuffled = shuffle(targetData);
    let limit = shuffled.length;
    if (!retryList && state.count !== 'all') {
      limit = Math.min(state.count, shuffled.length);
    }
    state.questions = shuffled.slice(0, limit);

    showSection(quizSec);
    loadQuestion();
  }

  function loadQuestion() {
    if (state.currentIndex >= state.questions.length) { showResult(); return; }
    const q = state.questions[state.currentIndex];
    barEl.style.width = `${(state.currentIndex / state.questions.length) * 100}%`;
    progEl.textContent = `${state.currentIndex + 1} / ${state.questions.length}`;
    posEl.textContent = q.pos || '意味';
    wordEl.textContent = q.w;
    fbEl.textContent = ''; fbEl.className = ''; nextBtn.hidden = true;

    let incorrectPool = DATA.filter(item => item.id !== q.id);
    let selectedIncorrect = shuffle(incorrectPool).slice(0, 3);
    let options = shuffle([q, ...selectedIncorrect]);

    optsDiv.innerHTML = '';
    options.forEach((optItem, idx) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = `<span class="n">${['①','②','③','④'][idx]}</span><span>${optItem.m}</span>`;
      btn.addEventListener('click', () => handleAnswer(optItem.id === q.id, q, btn));
      optsDiv.appendChild(btn);
    });
  }

  function handleAnswer(isCorrect, currentQ, clickedBtn) {
    const allOptBtns = optsDiv.querySelectorAll('button');
    allOptBtns.forEach(b => b.disabled = true);

    if (isCorrect) {
      state.score++;
      fbEl.textContent = '正解！'; fbEl.className = 'ok'; clickedBtn.classList.add('ok');
    } else {
      fbEl.textContent = '不正解...'; fbEl.className = 'ng'; clickedBtn.classList.add('ng');
      allOptBtns.forEach(b => { if (b.innerHTML.includes(currentQ.m)) b.classList.add('ok'); });
      if (!state.currentMisses.some(item => item.id === currentQ.id)) {
        state.currentMisses.push(currentQ);
      }
    }
    barEl.style.width = `${((state.currentIndex + 1) / state.questions.length) * 100}%`;
    nextBtn.hidden = false; nextBtn.focus();
  }

  function showResult() {
    if (state.currentMisses.length > 0) saveMisses(state.currentMisses);
    showSection(resultSec);
    rlEl.textContent = state.isRetryMode ? 'リトライ結果' : 'テスト結果';
    scoreEl.textContent = `${state.score} / ${state.questions.length} 問正解`;

    missListEl.innerHTML = '';
    if (state.currentMisses.length === 0) {
      missListEl.innerHTML = '<li class="empty" style="border:none;padding:8px 0;">今回は全問正解です！お見事です。</li>';
    } else {
      state.currentMisses.forEach(item => {
        const li = document.createElement('li');
        li.innerHTML = `<div><span class="w">${item.w}</span><span class="p">${item.pos || ''}</span></div><div class="m">${item.m}</div>`;
        missListEl.appendChild(li);
      });
    }
    updateMissCount();
  }

  function renderMissList() {
    const stored = getStoredMisses();
    wlEl.innerHTML = '';
    if (stored.length === 0) {
      wlEl.innerHTML = '<li class="empty">保存されている間違えた問題はありません。</li>';
      rv3Btn.disabled = true; clrBtn.disabled = true;
    } else {
      rv3Btn.disabled = false; clrBtn.disabled = false;
      stored.forEach(item => {
        const li = document.createElement('li');
        li.innerHTML = `<div><span class="w">${item.w}</span><span class="p">${item.pos || ''}</span></div><div class="m">${item.m}</div>`;
        wlEl.appendChild(li);
      });
    }
    showSection(listSec);
  }

  goBtn.addEventListener('click', () => startQuiz());
  quitBtn.addEventListener('click', () => {
    if (confirm('演習を中断しますか？\n（ここまでに間違えた問題は自動でストックされます）')) {
      if (state.currentMisses.length > 0) saveMisses(state.currentMisses);
      showSection(homeSec);
      updateMissCount();
    }
  });
  nextBtn.addEventListener('click', () => { state.currentIndex++; loadQuestion(); });
  againBtn.addEventListener('click', () => startQuiz());
  rv2Btn.addEventListener('click', () => { const stored = getStoredMisses(); if (stored.length > 0) startQuiz(stored); });
  hmBtn.addEventListener('click', () => { showSection(homeSec); updateMissCount(); });
  rvBtn.addEventListener('click', () => { const stored = getStoredMisses(); if (stored.length > 0) startQuiz(stored); });
  lsBtn.addEventListener('click', () => renderMissList());
  backBtn.addEventListener('click', () => { showSection(homeSec); updateMissCount(); });
  rv3Btn.addEventListener('click', () => { const stored = getStoredMisses(); if (stored.length > 0) startQuiz(stored); });
  clrBtn.addEventListener('click', () => {
    if (confirm('間違えた問題のストックをすべて削除しますか？')) {
      localStorage.removeItem(KEY_MISS);
      renderMissList();
      updateMissCount();
    }
  });

  initConfigUI();
  updateMissCount();
})();
</script>
</body>
</html>
