<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>GMARCH英語 4択小テスト</title><style>:root{--bg:#F3F5F9;--sf:#fff;--ink:#172033;--mut:#5d6677;--line:#d3d9e6;--ac:#3B4CCA;--acT:#fff;--ok:#1E8E5A;--okBg:#E1F3EA;--ng:#C93C4B;--ngBg:#FBE6E9;color-scheme:light}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11141B;--sf:#1A1F2A;--ink:#E7EAF3;--mut:#9AA3B5;--line:#2B3342;--ac:#8E9BFF;--acT:#10131c;--ok:#4CC68A;--okBg:#12301F;--ng:#FF7A88;--ngBg:#3A1820;color-scheme:dark}}:root[data-theme="dark"]{--bg:#11141B;--sf:#1A1F2A;--ink:#E7EAF3;--mut:#9AA3B5;--line:#2B3342;--ac:#8E9BFF;--acT:#10131c;--ok:#4CC68A;--okBg:#12301F;--ng:#FF7A88;--ngBg:#3A1820;color-scheme:dark}:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}*,*::before,*::after{box-sizing:inherit}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;-webkit-text-size-adjust:100%}main{max-width:560px;margin:0 auto;padding:20px 16px 40px}[hidden]{display:none!important}h1{font-size:22px;margin:8px 0 4px;letter-spacing:.02em}h2{margin:0}p{margin:0}.lead{color:var(--mut);font-size:14px;margin-bottom:20px}.sec{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}.sec h3{font-size:14px;margin:0 0 10px;color:var(--mut);font-weight:600}.seg{display:flex;gap:8px;flex-wrap:wrap}.seg button{flex:1;min-width:60px}button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--sf);border-radius:10px;padding:10px 12px;min-height:44px}button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}.seg button[aria-pressed="true"]{border-color:var(--ac);background:var(--ac);color:var(--acT);font-weight:600}.primary{width:100%;background:var(--ac);color:var(--acT);border-color:var(--ac);font-weight:700;font-size:17px;min-height:52px}.primary:disabled,.row button:disabled{opacity:.45;cursor:default}.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1}.ghost{background:transparent;border-color:transparent;color:var(--mut);padding:8px}.big{font-size:30px;font-weight:700;line-height:1.1}.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .25s}#prog{font-size:14px;color:var(--mut);min-width:56px;text-align:right}.card{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:22px 18px;margin-bottom:14px}.pos{display:inline-block;font-size:13px;color:var(--ac);border:1px solid var(--ac);border-radius:6px;padding:0 8px;margin-bottom:8px}#word{font:700 40px/1.15 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;overflow-wrap:anywhere}.ask{color:var(--mut);font-size:14px;margin-top:8px}.opt{display:flex;gap:12px;width:100%;text-align:left;margin-bottom:10px;padding:12px 14px;align-items:flex-start;line-height:1.5}.opt .n{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--mut);margin-top:1px}.opt:disabled{opacity:1;cursor:default}.opt.ok{border-color:var(--ok);background:var(--okBg)}.opt.ng{border-color:var(--ng);background:var(--ngBg)}.opt.ok .n{background:var(--ok);border-color:var(--ok);color:var(--sf)}.opt.ng .n{background:var(--ng);border-color:var(--ng);color:var(--sf)}.t{font-weight:600;color:var(--ac);margin-right:2px}#fb{min-height:28px;font-weight:700;margin:2px 0 8px}#fb.ok{color:var(--ok)}#fb.ng{color:var(--ng)}ul.list{list-style:none;margin:0;padding:0}ul.list li{padding:12px 0;border-top:1px solid var(--line)}ul.list li:first-child{border-top:0}ul.list .w{font:700 20px/1.2 "Iowan Old Style",Palatino,Georgia,serif;margin-right:8px}ul.list .p{font-size:12px;color:var(--mut)}ul.list .m{font-size:14px;color:var(--ink);margin-top:2px}.empty{color:var(--mut);font-size:14px}.danger{color:var(--ng);border-color:var(--ng)}@media (prefers-reduced-motion:reduce){.bar i{transition:none}}</style></head><body><main>
<section id="home">  <h1>GMARCH英語 4択小テスト</h1>  <p class="lead">多義語・派生語からランダムに出題します。間違えた問題は自動で保存され、あとでやり直せます。</p>  <div class="sec">    <h3>出題範囲</h3>    <div class="seg" id="scope"></div>  </div>  <div class="sec">    <h3>問題数</h3>    <div class="seg" id="count"></div>  </div>  <button class="primary" id="go">テストを始める</button>  <div class="sec" style="margin-top:14px">    <h3>間違えた問題</h3>    <p class="big" id="wn">0<span style="font-size:15px;font-weight:500;color:var(--mut)"> 問</span></p>    <div class="row">      <button id="rv">やり直す</button>      <button id="ls">一覧を見る</button>    </div>  </div></section>
<section id="quiz" hidden>  <div class="top"><button class="ghost" id="quit">やめる</button><div class="bar"><i id="bar"></i></div><span id="prog"></span></div>  <div class="card"><span class="pos" id="pos"></span><h2 id="word"></h2><p class="ask">この単語の意味として正しいものを選んでください</p></div>  <div id="opts"></div>  <p id="fb" role="status"></p>  <button class="primary" id="next" hidden>次へ</button></section>
<section id="result" hidden>  <div class="card">    <p class="ask" id="rl">結果</p>    <p class="big" id="score"></p>  </div>  <div class="sec" id="missWrap"><h3>今回の間違い</h3><ul class="list" id="miss"></ul></div>  <button class="primary" id="again">もう一度</button>  <div class="row"><button id="rv2">間違いをやり直す</button><button id="hm">ホームへ</button></div></section>
<section id="list" hidden>  <div class="top"><button class="ghost" id="back">← 戻る</button></div>  <div class="sec"><h3>間違えた問題</h3><ul class="list" id="wl"></ul></div>  <div class="row"><button id="rv3">やり直す</button><button id="clr" class="danger">すべて削除</button></div></section>

】偏見のない、公平な"},{"id145","set":"d","w":"partial","pos":"形","m":"【形】一部の、偏愛する"},{"id146","set":"d","w":"unearthly","pos":"形","m":"【形】この世のものと思えない、異常な"},{"id147","set":"d","w":"earthly","pos":"形","m":"【形】地球上の、世俗的な（否定文で「まったく」）"},{"id148","set":"d","w":"eventful","pos":"形","m":"【形】波乱万丈の、出来事の多い"},{"id149","set":"d","w":"eventual","pos":"形","m":"【形】最終的な、結果としての"},{"id150","set":"d","w":"graceful","pos":"形","m":"【形】優雅な、しとやかな"},{"id151","set":"d","w":"gracious","pos":"形","m":"【形】親切な、丁重な"},{"id152","set":"d","w":"masterly","pos":"形","m":"【形】見事な、熟練した"},{"id153","set":"d","w":"masterful","pos":"形","m":"【形】威厳のある、横暴な"},{"id154","set":"d","w":"pitiful","pos":"形","m":"【形】哀れな、痛ましい"},{"id155","set":"d","w":"pitiable","pos":"形","m":"【形】哀れむべき"},{"id156","set":"d","w":"piteous","pos":"形","m":"【形】痛ましい"},{"id157","set":"d","w":"pitiless","pos":"形","m":"【形】無情な、冷酷な"},{"id158","set":"d","w":"spiritual","pos":"形","m":"【形】精神の、霊的な"}]

// ロジック
(function(){
  const KEY_MISS = 'gmarch_quiz_miss_v1';
  let state = { scope: 'all', count: 10, questions: [], currentIndex: 0, score: 0, currentMisses: [], isRetryMode: false };

  const homeSec = document.getElementById('home'), quizSec = document.getElementById('quiz'), resultSec = document.getElementById('result'), listSec = document.getElementById('list');
  const scopeDiv = document.getElementById('scope'), countDiv = document.getElementById('count'), goBtn = document.getElementById('go'), wnEl = document.getElementById('wn'), rvBtn = document.getElementById('rv'), lsBtn = document.getElementById('ls');
  const quitBtn = document.getElementById('quit'), barEl = document.getElementById('bar'), progEl = document.getElementById('prog'), posEl = document.getElementById('pos'), wordEl = document.getElementById('word'), optsDiv = document.getElementById('opts'), fbEl = document.getElementById('fb'), nextBtn = document.getElementById('next');
  const rlEl = document.getElementById('rl'), scoreEl = document.getElementById('score'), missListEl = document.getElementById('miss'), againBtn = document.getElementById('again'), rv2Btn = document.getElementById('rv2'), hmBtn = document.getElementById('hm');
  const backBtn = document.getElementById('back'), wlEl = document.getElementById('wl'), rv3Btn = document.getElementById('rv3'), clrBtn = document.getElementById('clr');

  function getStoredMisses() { try { return JSON.parse(localStorage.getItem(KEY_MISS)) || []; } catch(e) { return []; } }
  function saveMisses(newMisses) {
    if (!newMisses || newMisses.length === 0) return;
    let stored = getStoredMisses(), map = new Map();
    stored.forEach(item => map.set(item.id, item));
    newMisses.forEach(item => map.set(item.id, item));
    localStorage.setItem(KEY_MISS, JSON.stringify(Array.from(map.values())));
    updateMissCount();
  }

  function updateMissCount() {
    const stored = getStoredMisses();
    wnEl.innerHTML = `${stored.length}<span style="font-size:15px;font-weight:500;color:var(--mut)"> 問</span>`;
    rvBtn.disabled = stored.length === 0;
    rv2Btn.disabled = stored.length === 0;
    rv3Btn.disabled = stored.length === 0;
  }

  function showSection(sec) {
    homeSec.hidden = true; quizSec.hidden = true; resultSec.hidden = true; listSec.hidden = true;
    sec.hidden = false; window.scrollTo(0, 0);
  }

  const scopes = [{id: 'all', label: 'すべて'}, {id: 'p', label: '多義語'}, {id: 'd', label: '派生語'}];
  const counts = [5, 10, 20, 30, 'all'];

  function initConfigUI() {
    scopeDiv.innerHTML = '';
    scopes.forEach(s => {
      const btn = document.createElement('button');
      btn.textContent = s.label;
      btn.setAttribute('aria-pressed', state.scope === s.id ? 'true' : 'false');
      btn.addEventListener('click', () => { state.scope = s.id; initConfigUI(); });
      scopeDiv.appendChild(btn);
    });
    countDiv.innerHTML = '';
    counts.forEach(c => {
      const btn = document.createElement('button');
      btn.textContent = c === 'all' ? 'すべて' : `${c}問`;
      btn.setAttribute('aria-pressed', state.count === c ? 'true' : 'false');
      btn.addEventListener('click', () => { state.count = c; initConfigUI(); });
      countDiv.appendChild(btn);
    });
  }

  function shuffle(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function startQuiz(retryList = null) {
    state.currentIndex = 0; state.score = 0; state.currentMisses = []; state.isRetryMode = !!retryList;
    let targetData = DATA;
    if (retryList) targetData = retryList;
    else if (state.scope !== 'all') targetData = DATA.filter(item => item.set === state.scope);

    if (targetData.length === 0) { alert('出題できる問題がありません。'); return; }

    let shuffled = shuffle(targetData);
    let limit = shuffled.length;
    if (!retryList && state.count !== 'all') {
      limit = Math.min(state.count, shuffled.length);
    }
    state.questions = shuffled.slice(0, limit);

    showSection(quizSec);
    loadQuestion();
  }

  function loadQuestion() {
    if (state.currentIndex >= state.questions.length) { showResult(); return; }
    const q = state.questions[state.currentIndex];
    barEl.style.width = `${(state.currentIndex / state.questions.length) * 100}%`;
    progEl.textContent = `${state.currentIndex + 1} / ${state.questions.length}`;
    posEl.textContent = q.pos || '意味';
    wordEl.textContent = q.w;
    fbEl.textContent = ''; fbEl.className = ''; nextBtn.hidden = true;

    let incorrectPool = DATA.filter(item => item.id !== q.id);
    let selectedIncorrect = shuffle(incorrectPool).slice(0, 3);
    let options = shuffle([q, ...selectedIncorrect]);

    optsDiv.innerHTML = '';
    options.forEach((optItem, idx) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = `<span class="n">${['①','②','③','④'][idx]}</span><span>${optItem.m}</span>`;
      btn.addEventListener('click', () => handleAnswer(optItem.id === q.id, q, btn));
      optsDiv.appendChild(btn);
    });
  }

  function handleAnswer(isCorrect, currentQ, clickedBtn) {
    const allOptBtns = optsDiv.querySelectorAll('button');
    allOptBtns.forEach(b => b.disabled = true);

    if (isCorrect) {
      state.score++;
      fbEl.textContent = '正解！'; fbEl.className = 'ok'; clickedBtn.classList.add('ok');
    } else {
      fbEl.textContent = '不正解...'; fbEl.className = 'ng'; clickedBtn.classList.add('ng');
      allOptBtns.forEach(b => { if (b.innerHTML.includes(currentQ.m)) b.classList.add('ok'); });
      if (!state.currentMisses.some(item => item.id === currentQ.id)) {
        state.currentMisses.push(currentQ);
      }
    }
    barEl.style.width = `${((state.currentIndex + 1) / state.questions.length) * 100}%`;
    nextBtn.hidden = false; nextBtn.focus();
  }

  function showResult() {
    if (state.currentMisses.length > 0) saveMisses(state.currentMisses);
    showSection(resultSec);
    rlEl.textContent = state.isRetryMode ? 'リトライ結果' : 'テスト結果';
    scoreEl.textContent = `${state.score} / ${state.questions.length} 問正解`;

    missListEl.innerHTML = '';
    if (state.currentMisses.length === 0) {
      missListEl.innerHTML = '<li class="empty" style="border:none;padding:8px 0;">今回は全問正解です！お見事です。</li>';
    } else {
      state.currentMisses.forEach(item => {
        const li = document.createElement('li');
        li.innerHTML = `<div><span class="w">${item.w}</span><span class="p">${item.pos || ''}</span></div><div class="m">${item.m}</div>`;
        missListEl.appendChild(li);
      });
    }
    updateMissCount();
  }

  function renderMissList() {
    const stored = getStoredMisses();
    wlEl.innerHTML = '';
    if (stored.length === 0) {
      wlEl.innerHTML = '<li class="empty">保存されている間違えた問題はありません。</li>';
      rv3Btn.disabled = true; clrBtn.disabled = true;
    } else {
      rv3Btn.disabled = false; clrBtn.disabled = false;
      stored.forEach(item => {
        const li = document.createElement('li');
        li.innerHTML = `<div><span class="w">${item.w}</span><span class="p">${item.pos || ''}</span></div><div class="m">${item.m}</div>`;
        wlEl.appendChild(li);
      });
    }
    showSection(listSec);
  }

  goBtn.addEventListener('click', () => startQuiz());
  quitBtn.addEventListener('click', () => {
    if (confirm('演習を中断しますか？\n（ここまでに間違えた問題は自動でストックされます）')) {
      if (state.currentMisses.length > 0) saveMisses(state.currentMisses);
      showSection(homeSec);
      updateMissCount();
    }
  });
  nextBtn.addEventListener('click', () => { state.currentIndex++; loadQuestion(); });
  againBtn.addEventListener('click', () => startQuiz());
  rv2Btn.addEventListener('click', () => { const stored = getStoredMisses(); if (stored.length > 0) startQuiz(stored); });
  hmBtn.addEventListener('click', () => { showSection(homeSec); updateMissCount(); });
  rvBtn.addEventListener('click', () => { const stored = getStoredMisses(); if (stored.length > 0) startQuiz(stored); });
  lsBtn.addEventListener('click', () => renderMissList());
  backBtn.addEventListener('click', () => { showSection(homeSec); updateMissCount(); });
  rv3Btn.addEventListener('click', () => { const stored = getStoredMisses(); if (stored.length > 0) startQuiz(stored); });
  clrBtn.addEventListener('click', () => {
    if (confirm('間違えた問題のストックをすべて削除しますか？')) {
      localStorage.removeItem(KEY_MISS);
      renderMissList();
      updateMissCount();
    }
  });
